name: Feed automobilus (zilnic)

on:
  schedule:
    - cron: "17 1 * * *"     # zilnic la 01:17 UTC (03:17 / 04:17 ora Romaniei)
  workflow_dispatch:          # buton "Run workflow" pentru rulare manuala

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Descarca feedul 2Performant
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
        run: python filtru_feed.py descarca
      - name: Filtreaza si genereaza feedul Google
        run: python filtru_feed.py export
      - name: Pregateste fisierele publicate
        run: |
          mkdir -p public
          mv feed_google_part1.tsv.gz public/automobilus.tsv.gz
          ls -la public
          test $(stat -c%s public/automobilus.tsv.gz) -gt 1000000   # opreste publicarea daca feedul e suspect de mic
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
